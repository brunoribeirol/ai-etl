version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ai_etl
      POSTGRES_PASSWORD: ai_etl
      POSTGRES_DB: ai_etl_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: testdb
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  # Application database — stores AI-ETL's own runs/analysis_runs audit tables.
  # Logically distinct from `postgres` above, which is a pipeline source/destination
  # the user points at their own data (see APP_DATABASE_URL vs. POSTGRES_URL).
  app-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ai_etl_app
      POSTGRES_PASSWORD: ai_etl_app
      POSTGRES_DB: ai_etl_app_db
    ports:
      - "5434:5432"
    volumes:
      - app_postgres_data:/var/lib/postgresql/data

  app-postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ai_etl_app_test
      POSTGRES_PASSWORD: ai_etl_app_test
      POSTGRES_DB: ai_etl_app_test_db
    ports:
      - "5435:5432"
    tmpfs:
      - /var/lib/postgresql/data

  # Streamlit app, for local dev parity with the Railway deploy — builds from
  # the same Dockerfile used in production. Reads its env from `.env` (see
  # .env.example for the full variable list, including CLERK_*/APP_DATABASE_URL).
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      PORT: "8501"
    env_file:
      - .env
    depends_on:
      - app-postgres
      - redis

  # Broker + result backend for Celery (Sprint 3, ADR-008) — async pipeline
  # execution and the per-tenant rate-limit counters in
  # services/execution_queue.py both live here. No persistence volume: the
  # rate-limit counters are meant to be ephemeral (fixed-window, self-expiring)
  # and task results already have result_expires=3600 (core/celery_app.py) —
  # losing this on a dev-machine restart isn't a real loss.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Celery worker, for local dev parity — production's worker process
  # management (Railway) is a separate decision, out of scope for this
  # compose file (see ADR-008's consequences). Same image as `app`, different
  # entrypoint command.
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    # --pool=threads (not the prefork default): core/sandbox.py needs to spawn
    # a real multiprocessing.Process per sandboxed execution for its timeout
    # enforcement (ADR-007) -- Celery's prefork pool runs each worker as a
    # daemonic process, and Python refuses to let a daemonic process have
    # children ("daemonic processes are not allowed to have children"). This
    # only surfaced once the worker actually ran a real pipeline for the
    # first time (found live against the Railway deploy) -- prefork's own
    # process-per-task concurrency is redundant with the sandbox's own
    # per-execution process isolation anyway, so threads is a fix, not a
    # regression in isolation guarantees.
    command: uv run celery -A ai_etl.core.celery_app:celery_app worker --loglevel=info --pool=threads --concurrency=2
    env_file:
      - .env
    depends_on:
      - app-postgres
      - redis

volumes:
  postgres_data:
  app_postgres_data:
