name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths: ["frontend/**"]
  pull_request:
    branches: [main]
    paths: ["frontend/**"]

jobs:
  check:
    name: "Frontend — Lint, Type, Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next build` runs its own TypeScript check as part of the build
      # (visible as a "Running TypeScript ..." step in its own output) — a
      # separate `tsc --noEmit` step here would additionally need to run
      # *after* build to see Next.js's generated global types (e.g.
      # `LayoutProps`, from `.next/types/`), which don't exist until a build
      # has run once. Not worth a second, ordering-fragile step for
      # duplicate coverage.
      - name: Build
        run: npm run build
        env:
          # No Clerk key needed here — verified locally that `next build`
          # succeeds without one: `/` is fully dynamic (uses `auth()` +
          # `fetch(..., {cache: "no-store"})`), so nothing Clerk-related
          # executes during the build/prerender step itself.
          NEXT_PUBLIC_API_URL: http://localhost:8000
