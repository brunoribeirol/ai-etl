name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths: ["frontend/**"]
  pull_request:
    branches: [main]
    paths: ["frontend/**"]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: "Frontend — Lint, Type, Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Parity with the backend's `pip-audit` step -- npm dependencies get
      # the same real vulnerability gate the Python side already has.
      # `--audit-level=high` (not `moderate`/every finding): a low/moderate
      # advisory in a transitive dev-only dependency shouldn't block every
      # PR the way pip-audit's stricter default does for a much smaller,
      # backend-only dependency tree; revisit the threshold if this proves
      # too loose in practice.
      #
      # `--omit=dev` (2026-09-03, real CI failure): `npm audit` audits every
      # dependency by default, dev-only tools included — this step failed on
      # `fast-uri`/`qs` advisories that only exist because `shadcn` (the
      # scaffolding CLI, `bin`-only, never imported by app code) pulls in
      # `@modelcontextprotocol/sdk` -> `express`/`ajv`. Moved `shadcn` to
      # `devDependencies` (its correct category) at the same time — neither
      # package ever reaches the deployed app, so auditing them here was
      # noise, not signal, exactly the gap `--omit=dev` closes.
      - name: Security — npm audit
        run: npm audit --omit=dev --audit-level=high

      # `next build` runs its own TypeScript check as part of the build
      # (visible as a "Running TypeScript ..." step in its own output) — a
      # separate `tsc --noEmit` step here would additionally need to run
      # *after* build to see Next.js's generated global types (e.g.
      # `LayoutProps`, from `.next/types/`), which don't exist until a build
      # has run once. Not worth a second, ordering-fragile step for
      # duplicate coverage.
      - name: Build
        run: npm run build
        env:
          # No Clerk key needed here — verified locally that `next build`
          # succeeds without one: `/` is fully dynamic (uses `auth()` +
          # `fetch(..., {cache: "no-store"})`), so nothing Clerk-related
          # executes during the build/prerender step itself.
          NEXT_PUBLIC_API_URL: http://localhost:8000
