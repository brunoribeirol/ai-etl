name: Postgres backup (manual stopgap)

# ADR-042 amendment (2026-09-06): Supabase's dashboard confirmed the Free
# Plan includes zero backups (no scheduled backups, no PITR) — the ADR's
# original assumption ("almost certainly available on paid tiers") was
# wrong for this project's actual tier. Owner chose a manual pg_dump-to-S3
# stopgap over a Supabase Pro upgrade for now. See
# docs/adr/ADR-042-rto-rpo-disaster-recovery.md's "Manual backup stopgap"
# section for the full decision and the restore procedure.
#
# This is deliberately NOT continuous (PITR) — one dump per day means an
# RPO of up to 24h, matching ADR-042's original target by coincidence, not
# by a stronger mechanism. Read the ADR before assuming this is equivalent
# to real PITR.

on:
  schedule:
    # 03:00 UTC daily — outside this project's own business hours, same
    # reasoning as `services/retention_service.py`'s off-peak cadence.
    - cron: "0 3 * * *"
  workflow_dispatch: {} # manual trigger, e.g. for the first backup or an ad-hoc one before a risky migration

permissions:
  contents: read

jobs:
  backup:
    name: pg_dump production Postgres to S3
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client (v17, matching Supabase's server version)
        # Ubuntu's own apt repo only ships postgresql-client 16, but this
        # project's Supabase Postgres is 17.6 — pg_dump refuses to run
        # against a newer server than itself ("aborting because of server
        # version mismatch", found running this workflow for the first
        # time, 2026-09-06). Pull the matching client from PGDG's own apt
        # repo instead of Ubuntu's.
        run: |
          set -euo pipefail
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: pg_dump (custom format, compressed)
        env:
          PGCONNECT_TIMEOUT: "30"
        # Explicit versioned path, not the bare `pg_dump` on PATH: found
        # running this workflow for the first time (2026-09-06) that even
        # with postgresql-client-17 installed alongside the runner's
        # pre-existing v16, the postgresql-common wrapper script still
        # resolved plain `pg_dump` to v16 — silently, no error, just the
        # wrong binary. Bypassing the wrapper entirely is more reliable
        # than debugging its version-selection logic in CI.
        #
        # `--schema=public`: Supabase's shared Postgres instance also has
        # `auth`/`storage`/`realtime` schemas it manages internally — a
        # first real run found `backup_reader` (deliberately granted only
        # `public` access, ADR-042) can't lock those tables, and this
        # application doesn't own them anyway (Supabase's own platform is
        # responsible for backing up its own internal schemas). This
        # project's actual data — `runs`, `users`, `saved_pipelines`, etc.
        # — all lives in `public`.
        run: |
          set -euo pipefail
          /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.BACKUP_DATABASE_URL }}" \
            --format=custom --no-owner --no-privileges --schema=public \
            --file=backup.dump

      - name: Upload to S3
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%d)"
          aws s3 cp backup.dump \
            "s3://${{ secrets.AI_ETL_S3_BUCKET }}/_system/db-backups/production/${DATE}.dump"

      - name: Verify the uploaded object is non-empty
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%d)"
          SIZE=$(aws s3api head-object \
            --bucket "${{ secrets.AI_ETL_S3_BUCKET }}" \
            --key "_system/db-backups/production/${DATE}.dump" \
            --query 'ContentLength' --output text)
          if [ "$SIZE" -lt 1024 ]; then
            echo "::error::Backup object is suspiciously small (${SIZE} bytes) — treating as a failed backup."
            exit 1
          fi
          echo "Backup verified: ${SIZE} bytes."
