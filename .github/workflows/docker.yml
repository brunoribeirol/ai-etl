name: Docker

# Builds the production Dockerfile in CI (no push) so a broken build is
# caught on a PR, not first discovered at Railway deploy time.
#
# Path-filtered: this image only depends on these inputs. Unrelated changes
# such as frontend-only or documentation-only updates do not trigger a build.
on:
  push:
    branches: [main, develop]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "case_study/**"
      - ".env.example"
      - ".github/workflows/docker.yml"

  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "case_study/**"
      - ".env.example"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build image + Trivy vulnerability scan"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build the production image locally in the GitHub runner.
      # Nothing is pushed from this workflow.
      #
      # `load: true` makes the resulting image available to Trivy below.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ai-etl:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Security gate for the production container image.
      #
      # HIGH and CRITICAL vulnerabilities with an available fix fail CI.
      # Vulnerabilities for which the upstream distribution does not yet
      # provide a fix are still visible to Trivy but do not block the PR.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ai-etl:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
