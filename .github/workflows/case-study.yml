name: Case study (public data, real models)

# Manual trigger ONLY, for the same reason as prompt-regression.yml (ADR-029): every
# run here calls a real model and costs real money. This is the reproducible path
# for the case-study evidence: public data fetched and checked against the
# committed manifest, a clean Linux runner (the analysis layer's plotly import
# hangs inside the sandbox on macOS, see CLAUDE.md), and every run's artefacts
# uploaded.
#
# Unlike the regression harness, a missing provider key does NOT fall back to
# mocked responses: the runner records those runs as `skipped` and this job
# fails if nothing at all was executed.
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated models (prefix with provider, e.g. anthropic:claude-haiku-5-5)"
        type: string
        default: "gpt-4o-mini"
      runs:
        description: "Independent runs per scenario and model"
        type: string
        default: "5"
      scenarios:
        description: "Comma-separated scenario ids (1-4)"
        type: string
        default: "1,2,3,4"
      job:
        description: "case-study: the scenarios above. connectors: one run per connector the scenarios do not reach"
        type: choice
        options:
          - case-study
          - connectors
        default: case-study

permissions:
  contents: read

jobs:
  case-study:
    name: "Case study over public data"
    if: ${{ inputs.job != 'connectors' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PGUSER: case_study
      PGPASSWORD: case_study
      PGDATABASE: case_study
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: case_study
          POSTGRES_PASSWORD: case_study
          POSTGRES_DB: case_study
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Point the pipeline at the service database
        run: echo "POSTGRES_URL=postgresql://${PGUSER}:${PGPASSWORD}@localhost:5432/${PGDATABASE}" >> "$GITHUB_ENV"

      - name: Fetch the public data and check it against the manifest
        run: uv run python case_study/data/fetch_public_data.py --verify

      - name: Load the taxi-zone table
        run: uv run python case_study/data/seed_public_postgres.py

      - name: Run the case study
        # Inputs reach the shell through env, never by direct interpolation into
        # the script, so a crafted input cannot inject commands.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CASE_STUDY_MODELS: ${{ inputs.models }}
          CASE_STUDY_RUNS: ${{ inputs.runs }}
          CASE_STUDY_SCENARIOS: ${{ inputs.scenarios }}
        run: |
          uv run python case_study/scripts/run_case_study.py \
            --models "$CASE_STUDY_MODELS" \
            --runs "$CASE_STUDY_RUNS" \
            --scenarios "$CASE_STUDY_SCENARIOS" \
            --label "run-${GITHUB_RUN_ID}"

      - name: Publish the summary
        if: always()
        run: |
          summary="case_study/results/public/run-${GITHUB_RUN_ID}/summary.json"
          if [ -f "$summary" ]; then
            {
              echo '### Case study: raw summary'
              echo '```json'
              cat "$summary"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: case-study-run-${{ github.run_id }}
          path: |
            case_study/results/public/
            case_study/public_data_manifest.json
          if-no-files-found: warn
          retention-days: 90

  # The sources and destinations the scenarios above do not reach (MySQL, MongoDB, SQLite,
  # Parquet in S3-compatible storage), each run once through the ETL layer's entry point
  # with a real model. MySQL and MongoDB are real servers started for this job; SQLite is a
  # file. The S3 side is an emulator of the S3 API: it checks the destination's own code
  # path (the client calls over HTTP, the Parquet write, the count read back), not AWS.
  connectors:
    name: "Connectors the case study does not reach"
    if: ${{ inputs.job == 'connectors' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHECK_DB_USER: root
      CHECK_DB_PASSWORD: connector_check
      CHECK_DB_NAME: connector_check
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: connector_check
          MYSQL_DATABASE: connector_check
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -pconnector_check"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Start the emulator of the S3 API
        # moto server answers the S3 HTTP API on the runner. It is an emulator, not an
        # object store and not AWS. An object store was tried first (MinIO): its image
        # can no longer be pulled from Docker Hub or from Quay.
        run: |
          nohup uvx --from 'moto[server]' moto_server -H 127.0.0.1 -p 9000 > moto.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl -sf "http://127.0.0.1:9000/moto-api/" > /dev/null; then exit 0; fi
            sleep 2
          done
          cat moto.log
          exit 1

      - name: Point the pipeline at the services
        run: |
          {
            echo "MYSQL_URL=mysql+pymysql://${CHECK_DB_USER}:${CHECK_DB_PASSWORD}@127.0.0.1:3306/${CHECK_DB_NAME}"
            echo "MONGODB_URI=mongodb://127.0.0.1:27017"
            echo "AWS_ENDPOINT_URL=http://127.0.0.1:9000"
            echo "AWS_ACCESS_KEY_ID=connector-check"
            echo "AWS_SECRET_ACCESS_KEY=connector-check"
            echo "AWS_DEFAULT_REGION=us-east-1"
            echo "CONNECTOR_CHECK_BUCKET=connector-check"
            echo "CONNECTOR_CHECK_STORAGE=moto server (emulator of the S3 API)"
          } >> "$GITHUB_ENV"

      - name: Fetch the public data and check it against the manifest
        run: uv run python case_study/data/fetch_public_data.py --verify

      - name: Run the connector check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CASE_STUDY_MODELS: ${{ inputs.models }}
        run: |
          uv run python case_study/scripts/connector_check.py \
            --model "$CASE_STUDY_MODELS" \
            --label "run-${GITHUB_RUN_ID}"

      - name: Publish the summary
        if: always()
        run: |
          summary="case_study/results/connectors/run-${GITHUB_RUN_ID}/summary.json"
          if [ -f "$summary" ]; then
            {
              echo '### Connector check: raw summary'
              echo '```json'
              cat "$summary"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload run artefacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: connector-check-run-${{ github.run_id }}
          path: case_study/results/connectors/
          if-no-files-found: warn
          retention-days: 90
