name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  check:
    name: "Python ${{ matrix.python-version }} — Lint, Format, Type, Test, Security"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    # mysql-test/mongodb-test (Sprint 11, ADR-012) are deliberately added
    # here, not to the `e2e` job's services below — unlike a live Postgres
    # (see the `e2e` job's comment on why THAT stays isolated from `check`),
    # these two only gate tests/integration/test_mysql_source_real.py and
    # test_mongodb_source_real.py's own reachability checks, so adding them
    # doesn't unblock any pre-existing self-skipping integration test.
    services:
      mysql-test:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_DATABASE: testdb
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -ptest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mongodb-test:
        image: mongo:7
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format check
        run: uv run ruff format --check src/ tests/

      - name: Type check
        run: uv run mypy src/

      - name: Unit tests
        run: uv run pytest tests/unit/ -v --cov=src/ai_etl --cov-report=term-missing --cov-fail-under=80

      - name: Integration tests
        run: uv run pytest tests/integration/ -v
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Security — bandit
        run: uv run bandit -c pyproject.toml -r src/ai_etl/

      - name: Security — pip-audit
        # `uv sync`'s bootstrap pip inside the venv drifts out of date
        # independently of this project's own declared deps -- upgrade it
        # right before auditing so a newly-disclosed pip-itself CVE
        # (unrelated to any dependency this project actually chose) doesn't
        # fail every PR until the next `uv` release bumps the bundled pip.
        run: |
          uv run pip install --upgrade pip
          uv run pip-audit

  e2e:
    name: "E2E (Sprint 5) — full stack against real Postgres/Redis"
    runs-on: ubuntu-latest
    # Deliberately its own job, not folded into `check`'s matrix: giving the
    # `check` job's services a live Postgres would also make
    # tests/integration/ stop self-skipping (see
    # tests/integration/test_audit_persistence.py's `_database_reachable()`
    # guard) and start running for real — which surfaced pre-existing,
    # unrelated integration-test bugs predating this PR (a tenant_id NOT NULL
    # constraint mismatch, an Alembic migration-test table-already-exists
    # conflict) that are out of Sprint 5's scope to fix here. Isolating e2e in
    # its own job with its own services keeps `check` behavior unchanged.
    services:
      postgres-test:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      app-postgres-test:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ai_etl_app_test
          POSTGRES_PASSWORD: ai_etl_app_test
          POSTGRES_DB: ai_etl_app_test_db
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: E2E tests
        run: uv run pytest tests/e2e/ -v --timeout=300
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
