name: CodeQL

# GitHub's native SAST for both languages in this repo (Python backend,
# TypeScript frontend). It was DISABLED while this repo was private —
# code scanning on a private repo needs GitHub Advanced Security (not on
# this account's plan), so every run failed at the upload step (PRs
# #73/#82/#83, 2026-08-21).
#
# RE-ENABLED 2026-09-09 (audit finding M2): the repository has been PUBLIC
# since 2026-08-30, and code scanning is free on public repositories — the
# billing blocker that justified disabling it no longer exists. The three
# automatic triggers below are restored. If a run ever fails at the upload
# step again (e.g. the repo goes private), re-comment them rather than
# leaving a persistently-red check.
on:
  workflow_dispatch: {}
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, not on every push -- CodeQL's own analysis is heavier than
    # this project's other CI jobs; a push/PR trigger already covers real
    # code changes, this catches anything a new query pack starts flagging
    # in code that hasn't changed.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: "CodeQL — ${{ matrix.language }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
