name: CodeQL

# GitHub's native SAST for both languages in this repo:
# - Python backend
# - TypeScript frontend
#
# CodeQL code scanning is not available for this private repository under the
# current GitHub plan, so automatic analysis must not run while the repository
# remains private.
#
# The workflow stays fully configured and keeps all automatic triggers.
#
# It will run automatically when:
#   1. the repository is public; OR
#   2. the repository variable ENABLE_CODEQL is set to "true"
#
# The second option allows CodeQL to be enabled later on a private repository
# if GitHub Code Security / Advanced Security becomes available, without
# changing this workflow again.

on:
  workflow_dispatch: {}
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Weekly analysis catches findings introduced by new CodeQL query packs
    # even when the repository code itself has not changed.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: ${{ github.event.repository.private == false || vars.ENABLE_CODEQL == 'true' }}
    name: "CodeQL — ${{ matrix.language }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: "/language:${{ matrix.language }}"
