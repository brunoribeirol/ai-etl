name: CodeQL

# GitHub's native SAST for both languages in this repo (Python backend,
# TypeScript frontend). Confirmed via real PRs (#73/#82/#83, 2026-08-21):
# code scanning on this *private* repository requires GitHub Advanced
# Security, which this account's plan doesn't include -- every run failed
# at the `analyze`/upload step with "Code scanning is not enabled for this
# repository," on every PR, with no way to fix it from workflow config
# (it's a plan/billing decision, not a bug here).
#
# DISABLED (automatic triggers removed, `workflow_dispatch` kept) rather
# than deleted -- every PR was showing a real-looking red X for a check
# nobody can act on, which trains reviewers to ignore failing checks in
# general, a worse outcome than not having this workflow at all. The job
# itself is untouched and correct; it activates again with zero code
# changes the moment this repo gets GHAS (uncomment the `push`/
# `pull_request`/`schedule` triggers below), or can be run manually any
# time via `gh workflow run codeql.yml` / the Actions tab to re-check
# whether the plan situation has changed.
on:
  workflow_dispatch: {}
  # push:
  #   branches: [main, develop]
  # pull_request:
  #   branches: [main]
  # schedule:
  #   # Weekly, not on every push -- CodeQL's own analysis is heavier than
  #   # this project's other CI jobs; a push/PR trigger already covers real
  #   # code changes, this catches anything a new query pack starts flagging
  #   # in code that hasn't changed.
  #   - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: "CodeQL — ${{ matrix.language }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
