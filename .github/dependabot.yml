version: 2

# Version updates are paused until the TCC delivery on 2026-10-30: every ecosystem
# below has `open-pull-requests-limit: 0`. The code is frozen until then, and the
# case-study evidence was measured on the versions pinned in `uv.lock`. Security
# updates are not affected by this limit and still open pull requests.
# To resume after the delivery: set the five limits back to 5.

updates:
  # ===========================================================================
  # Python / uv
  # ===========================================================================

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "python"

    groups:
      python-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"


  # ===========================================================================
  # Frontend / npm
  # ===========================================================================

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "frontend"

    groups:
      frontend-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"


  # ===========================================================================
  # GitHub Actions
  # ===========================================================================

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "github-actions"

    groups:
      actions-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"


  # ===========================================================================
  # Docker
  # ===========================================================================

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "docker"


  # ===========================================================================
  # Terraform
  # ===========================================================================

  - package-ecosystem: "terraform"
    directory: "/infra/aws/terraform"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "terraform"
