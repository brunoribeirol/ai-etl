[project]
name = "ai-etl"
version = "0.1.0"
description = "Multi-agent framework for automated ETL pipelines using LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    # Multi-provider LLM support (Sprint 23, ADR-012) — base dependencies, not
    # extras, since core/llm.py's get_llm() is called unconditionally by every
    # agent regardless of which AI_ETL_LLM_PROVIDER is configured at runtime.
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.0",
    "openai>=1.50.0",
    "pandas>=2.0.0,<4.0.0",
    "openpyxl>=3.1.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "pyjwt[crypto]>=2.13.0",
    # Sprint 19 (ADR-021) — Fernet symmetric encryption for tenant_secrets
    # (services/secrets_service.py). Not a new install: pyjwt[crypto] above
    # already pulls in `cryptography` transitively; declared explicitly here
    # now that application code imports it directly.
    "cryptography>=44.0.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "boto3>=1.34.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    # Sprint 11 (ADR-012) — additional source connectors. pymysql is a
    # pure-Python MySQL/MariaDB driver (SQLAlchemy dialect mysql+pymysql) —
    # no compiled/system dependency, same "drop-in, no extra setup" bar
    # psycopg2-binary already meets for Postgres. pymongo is the official
    # MongoDB driver — no SQLAlchemy dialect exists for a document store,
    # so mongodb_source.py talks to it directly.
    "pymysql>=1.1.0",
    "pymongo>=4.8.0",
    # Sprint 22 (dirty-data robustness) — was already resolved transitively
    # via `requests` (a `langchain`/`openai` sub-dependency), but importing
    # it directly from `sources/csv_source.py` needs it pinned as a real,
    # declared dependency rather than relying on another package's internals.
    "charset-normalizer>=3.3.0",
    # Sprint 13 (ADR-016) — recurring/scheduled pipelines. Pure-Python cron
    # parsing/next-fire-time computation (month-end, leap years, DST), same
    # "no compiled/system dependency" bar as pymysql/pymongo above.
    "croniter>=2.0.0",
    # Sprint 29 (ADR-019) — was already resolved transitively (pydantic/fastapi
    # depend on it), but `services/execution_queue.py::BudgetStatus` needs it
    # imported directly: `typing.TypedDict` fails Pydantic's schema generation
    # on Python < 3.12 (used as a FastAPI route return type in
    # `api/routers/budget.py`) — CI's Python 3.11 job caught this for real.
    "typing_extensions>=4.12.0",
    # Real pipeline runtime dependencies, not Streamlit-only despite living
    # under the `app` extra until Sprint 6 (2026-08-17): `agents/analyst.py`/
    # `agents/science.py` import these inside the sandbox via `extra_modules`
    # (`px`/`go` -> plotly, sklearn estimators, statsmodels) to generate
    # charts and fit models — code paths the API (`src/ai_etl/api/`) exercises
    # too, same as Streamlit. Moved to base `dependencies` so a future
    # Streamlit-only trim (Sprint 6 PR 6's Railway cutover) can't silently
    # drop something the pipeline itself needs at runtime.
    "plotly>=6.8.0",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.0",
    # Sprint 20 (ADR-021) — S3-Parquet warehouse destination. Used only as
    # pandas' `to_parquet`/`read_parquet` serialization engine (in-memory
    # buffer) — never `pyarrow.fs.S3FileSystem`, which ADR-009 already found
    # hangs indefinitely in this kind of sandboxed environment; S3 I/O itself
    # stays on the already-proven `boto3` path.
    "pyarrow>=15.0.0",
    # Sprint 34 (ADR-033) — error tracking/APM, initialized conditionally by
    # `core/observability.py::init_sentry()` (no `SENTRY_DSN` = no-op, same
    # "optional, never breaks if absent" convention as Resend/Slack in
    # `services/notifications.py`). Base dependency, not an extra: both the
    # API process (`api/main.py`) and the Celery worker (`core/celery_app.py`)
    # need it importable unconditionally, same rationale as
    # langchain-anthropic/-google-genai/-ollama above. `[celery,fastapi]`
    # pulls in both framework integrations this project actually uses.
    "sentry-sdk[celery,fastapi]>=2.0.0",
]

[project.optional-dependencies]
# Sprint 6 (ADR-011) — HTTP API layer for the Next.js frontend. The old
# `app` extra (streamlit) was retired in the PR 6 cutover — app.py is gone,
# Streamlit no longer runs anywhere in this project.
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
]

# ADR-039 — production sandbox isolation backend (core/sandbox_vercel.py).
# Optional: base dependencies and every other backend work without it; only
# needed when AI_ETL_SANDBOX_BACKEND=vercel (or backend="vercel") is used.
vercel-sandbox = [
    "vercel>=0.10.0",
]

dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "pandas-stubs>=2.0.0,<4.0.0",
    "bandit>=1.8.0",
    "pip-audit>=2.7.0",
    "pre-commit>=3.7.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_etl"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
skips = ["B101", "B102"]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v"

[tool.coverage.run]
source = ["src/ai_etl"]
omit = ["*/__init__.py", "src/ai_etl/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
