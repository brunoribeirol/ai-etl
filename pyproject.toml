[project]
name = "ai-etl"
version = "0.1.0"
description = "Multi-agent framework for automated ETL pipelines using LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.2.0",
    "openai>=1.50.0",
    "pandas>=2.0.0,<4.0.0",
    "openpyxl>=3.1.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
app = [
    "plotly>=6.8.0",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.0",
    "streamlit>=1.35.0",
]

dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "pandas-stubs>=2.0.0,<4.0.0",
    "bandit>=1.8.0",
    "pip-audit>=2.7.0",
    "pre-commit>=3.7.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_etl"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
skips = ["B101", "B102"]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v"

[tool.coverage.run]
source = ["src/ai_etl"]
omit = ["*/__init__.py", "src/ai_etl/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
